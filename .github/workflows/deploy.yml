name: deploy

# Every push to main deploys to the production environment.
# GitHub secrets used: none. AWS by OIDC (role trusted only for environment "production",
# which only main may use); the Cloudflare token is read from SSM.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.10.10
  NODE_VERSION: 22

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.DOMAIN_NAME }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: DynamoDB Local for the tests
        run: |
          docker run -d --name ddb -p 8000:8000 amazon/dynamodb-local:2.5.3 -jar DynamoDBLocal.jar -inMemory -sharedDb
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            [ "$code" = "400" ] && echo "DynamoDB Local is up" && exit 0
            sleep 1
          done
          docker logs ddb; exit 1
      - run: npm test
      - run: npm run build

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/annotatie-gh-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Cloudflare token from SSM
        run: |
          token=$(aws ssm get-parameter --name "${{ vars.CF_TOKEN_PARAM }}" --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Plan
        working-directory: infra/live
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          tofu plan -input=false -out=tfplan \
            -var "aws_region=${{ vars.AWS_REGION }}" \
            -var "domain_name=${{ vars.DOMAIN_NAME }}" \
            -var "cloudflare_zone=${{ vars.CLOUDFLARE_ZONE }}" \
            -var "build_sha=${{ github.sha }}" \
            -var "alarm_email=${{ vars.ALARM_EMAIL }}"
          tofu show -json tfplan > plan.json

      - name: Cost guard (no fixed-cost resources)
        run: node tools/cost-guard/cli.mjs infra/live/plan.json

      - name: Apply
        working-directory: infra/live
        run: |
          tofu apply -input=false tfplan
          echo "DIST_ID=$(tofu output -raw distribution_id)" >> "$GITHUB_ENV"

      - name: Invalidate HTML
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" \
            --paths "/index.html" "/board/*" "/sdk/*" --query Invalidation.Id --output text

      - name: Smoke tests
        env:
          BASE: https://${{ vars.DOMAIN_NAME }}
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "$BASE/api/health" || true)
            echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\"" && break
            sleep 10
          done
          echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\"" || { echo "health check never showed ${GITHUB_SHA}: $body"; exit 1; }
          curl -fsS -o /dev/null "$BASE/board/"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/does-not-exist")
          test "$code" = "404"
          # P1 discovery (RFC 8414, RFC 9728) and the JWKS
          curl -fsS "$BASE/.well-known/oauth-authorization-server" | grep -q '"issuer":"'"$BASE"'"'
          curl -fsS "$BASE/.well-known/oauth-protected-resource/mcp" | grep -q '"resource":"'"$BASE/mcp"'"'
          curl -fsS "$BASE/oauth/jwks" | grep -q '"keys"'
          # P5: /mcp without a token points the client at the metadata
          hdr=$(curl -s -o /dev/null -D - -X POST -H 'content-type: application/json' -d '{}' "$BASE/mcp")
          echo "$hdr" | grep -qi '^HTTP/[0-9.]* 401'
          echo "$hdr" | grep -qi 'www-authenticate: Bearer resource_metadata='
          # P4: the widget script
          curl -fsS -o /dev/null "$BASE/sdk/v1/annotatie.js"
          echo "Deployed ${GITHUB_SHA} to $BASE" >> "$GITHUB_STEP_SUMMARY"
