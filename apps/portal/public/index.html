<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotatie</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --text:#1b1f24; --muted:#5b6470; --accent:#3b4cca; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --text:#e7eaee; --muted:#9aa4b1; --accent:#8b97ff; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif; padding:16px; }
  main { max-width:420px; }
  .mark { width:40px; height:40px; border-radius:10px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; }
  p { color:var(--muted); }
  code { font-size:13px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">A</div>
  <h1>Annotatie</h1>
  <p>The portal isn't open yet. This page shows that the deployment pipeline works.</p>
  <p>Build <code id="v">…</code></p>
</main>
<script>
  fetch("/api/health").then(r => r.json()).then(j => { document.getElementById("v").textContent = j.version; })
    .catch(() => { document.getElementById("v").textContent = "API not reachable"; });
</script>
</body>
</html>
